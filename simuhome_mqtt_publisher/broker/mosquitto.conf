# Mosquitto 配置：替换有缺陷的 amqtt
# 只监听环回（HA 容器经 host.docker.internal 来的连接在本机表现为 127.0.0.1），并开启账号密码
listener 1883 127.0.0.1
allow_anonymous false
password_file D:/D_coderesource/simuhome/simuhome_mqtt_publisher/broker/mosquitto.passwd

# 日志与持久化
log_dest file D:/D_coderesource/simuhome/simuhome_mqtt_publisher/logs/mosquitto.log
log_type error
log_type warning
log_type notice
persistence true
persistence_location D:/D_coderesource/simuhome/simuhome_mqtt_publisher/logs/
