# Mosquitto 配置：账号密码 + 只监听环回
# 相对路径以"启动时的当前目录"为基准：用 start_mosquitto.ps1 启动（它会把工作目录设为本目录）；
# 手动启动时先 cd 到本目录：mosquitto -c mosquitto.conf
# Windows 的 Docker Desktop 里，HA 容器经 host.docker.internal 访问宿主回环，127.0.0.1 可用；
# Linux 用 Docker Engine 时容器到不了宿主回环，需把 listener 改成 0.0.0.0 并自行加防火墙
listener 1883 127.0.0.1
allow_anonymous false
password_file mosquitto.passwd

# 日志与持久化
log_dest file ../logs/mosquitto.log
log_type error
log_type warning
log_type notice
persistence true
persistence_location ../logs/
