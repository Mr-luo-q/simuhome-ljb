# 通用版 HA 容器（给新环境用；本机历史版本在 old_simuhome_bridge_project\compose.yaml）
# 用法：先设置 HA 配置目录，再启动；未设置时 compose 会直接报错，避免误建空配置
#   PowerShell: $env:HA_CONFIG_DIR = "D:\homeassistant\config"
#   bash:       export HA_CONFIG_DIR=$HOME/ha-config
name: simuhome_bridge_project

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    ports:
      - "8123:8123"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ${HA_CONFIG_DIR:?请先设置 HA_CONFIG_DIR 指向 HA 的配置目录}:/config
