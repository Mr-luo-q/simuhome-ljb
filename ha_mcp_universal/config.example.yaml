# 配置模板：复制成 config.yaml 后填令牌。${VAR} 占位符由 runtime 替换，不用 !env。
ha:
  base_url: http://localhost:8123
  token: ${HA_TOKEN}            # HA 长期访问令牌
  timeout_s: 25                 # 云设备（米家）写入偶尔 >10 s，实测超时会被判成 HA_UNREACHABLE

rooms:                          # room_id → HA 的 area_id；当前三个房间同名
  living_room: living_room
  kitchen: kitchen
  utility_room: utility_room

room_env: {}                    # 留空：按 area + sensor.device_class 推导四类环境量
devices: {}                     # 留空：映射表由实体注册表在启动时生成，配置只作覆盖
doors: []                       # 当前没有门磁实体，inspect_room 的 doors 恒为 null

# 认领规则（M1 起）：决定"哪些实体属于我们"。整段留空 = v1 行为
# （platform==mqtt 且 unique_id 以 simuhome_ 开头，且以 _switch/_climate/_fan 结尾）
claim:
  - name: sandbox               # 沙盒投影（SimuHome → MQTT → HA）
    platforms: [mqtt]
    unique_id_prefix: simuhome_
    id_source: identifier
    kind_by_suffix:
      _switch: switch
      _climate: climate
      _fan: fan
  - name: xiaomi                # 米家：只写规则，不写专有代码
    platforms: [xiaomi_home]
    domains: [switch, light, climate, fan, cover, number, select, sensor]
    id_source: device_name
    exclude_category: [config, diagnostic]
    exclude_entities: ["button.*", "update.*", "*_reset_*"]

# 房间显示：alias 改对外名字（不改 HA），hide_empty 隐藏"既没设备也没环境量"的区域
areas:
  alias: {}
  hide_empty: false

# 设备别名文件：首次扫描生成，可手工改（中文设备名没法自动生成有意义的 id）
aliases:
  file: ./data/device_aliases.yaml

execution:
  verify_after_action: true
  verify_delay_ms: 800          # 本地 MQTT 一次命令 + 回读 236~388 ms；云设备（米家）落定可达数秒
  verify_attempts: 4

events:
  exclude_entities:             # query_events 默认排除的噪声源，实测占 logbook 的 91%
    - sensor.simuhome_virtual_time

memory:
  file: ./data/memory.yaml           # 记忆文件：整段文本，读写同构（见 14 号）
  max_write_tokens: 200              # 写入硬上限；超过 BAD_REQUEST
  max_read_tokens: 300               # 读取超限按内部策略截断

time:
  timezone: Asia/Shanghai
  db: ./data/schedules.db            # 预约单落盘位置
  max_horizon_days: 7                # 预约最远期限
  max_steps: 8                       # 单张预约单最多动作数

tools:
  expose:                       # 对模型开放的白名单；留空 = 开放契约里的全部工具
    - observe_home
    - inspect_room
    - inspect_device
    - execute_action
    - finish
    - inspect_time
    - time_control
    - memory

server:
  transport: stdio              # stdio 或 http
  http:
    host: 127.0.0.1
    port: 8765
    auth_token: ${MCP_TOKEN}
